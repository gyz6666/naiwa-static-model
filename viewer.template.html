<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f1e8"><title>奶蛙 · 曲面修整版</title>
<script type="importmap">{"imports":{"three":"./three.module.min.js"}}</script>
<style>
:root{color-scheme:light;font-family:"PingFang SC",system-ui,sans-serif;color:#4e513c;background:#f4f1e8}*{box-sizing:border-box}body{margin:0}main{height:100svh;min-height:420px;background:radial-gradient(ellipse at 50% 38%,#fffdf6,#f4f1e8 72%)}header{position:absolute;z-index:2;top:30px;left:36px;font-size:20px;font-weight:550;letter-spacing:4px}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}nav{position:absolute;z-index:2;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;padding:7px;border:1px solid #fff;background:#fffaf1bd;backdrop-filter:blur(12px);border-radius:30px;box-shadow:0 4px 24px #6453260a}button,a.control{display:grid;place-items:center;position:relative;border:0;border-radius:50%;background:transparent;width:42px;height:42px;color:#7b806b;cursor:pointer;text-decoration:none}button:hover,a.control:hover{background:#eae4d4;color:#464f37}button[aria-pressed="true"]{background:#e8d684;color:#5d5731}button:focus-visible,a:focus-visible{outline:2px solid #78815a;outline-offset:3px}svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}#error{position:absolute;inset:40% 15% auto;text-align:center;font-size:13px}#loading{position:absolute;inset:48% auto auto 50%;width:28px;height:28px;margin-left:-14px;border:2px solid #dad6c6;border-top-color:#a7b07d;border-radius:50%;animation:turn 1s linear infinite;pointer-events:none}@keyframes turn{to{transform:rotate(360deg)}}[hidden]{display:none!important}@media(max-width:600px){header{top:23px;left:24px;font-size:18px}nav{bottom:22px}button,a.control{width:38px;height:38px}}
</style></head><body><main><header>奶蛙</header><canvas id="model" tabindex="0" aria-label="奶蛙三维模型，可用方向键或拖动旋转"></canvas><div id="loading" role="status"><span class="sr-only">模型加载中</span></div><p id="error" hidden></p>
<nav aria-label="模型视角">
<button id="reset" aria-label="恢复默认视角" title="恢复默认视角"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 .8 7M4 4v6h6"/></svg></button>
<button id="front" aria-label="正面" title="正面"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="7"/><path d="M8 10h1m6 0h1m-7 5h6"/></svg></button>
<button id="side" aria-label="侧面" title="侧面"><svg viewBox="0 0 24 24"><path d="M9 21V3c5 0 7 3 7 7l3 3h-3v5h-7m4-11v1"/></svg></button>
<button id="back" aria-label="背面" title="背面"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="7"/><path d="M12 8v8"/></svg></button>
<button id="spin" aria-label="自动旋转" title="自动旋转" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 8a9 4 0 1 1-1 7m1-11v4h4m2 1v7m4-7v7"/></svg></button>
<a class="control" href="./naiwa-refined.glb" download aria-label="下载三维模型" title="下载三维模型"><svg viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 17v4h14v-4"/></svg></a>
</nav></main><script type="module" src="./viewer.js"></script></body></html>
